# Render blueprint for the two off-chain processes.
#
# THEY ARE SEPARATE SERVICES ON PURPOSE, and it is not about scaling.
#
#   - The SEQUENCER is trusted for liveness and ordering only. If it is compromised it can
#     stall the market. It cannot steal (flushBatch checks submitted leaves against the
#     on-chain queue), cannot forge a leaf, and cannot learn who bet what.
#   - The PUBLISHER holds the COMMITTEE SECRET. If it is compromised the attacker decrypts
#     every individual bet in every market, retroactively. That is the entire privacy claim
#     of the product, in one environment variable.
#
# Separate services means separate environment groups, so the committee key never enters the
# sequencer's environment at all. That is free and it is the one isolation worth keeping.
#
# WHAT THIS DOES NOT FIX: a single committee key is single-operator trust regardless of where
# it runs. Hosting is not the answer to that; the 3-of-5 threshold committee is.

services:
  # ---------------------------------------------------------------------------
  # Sequencer -- MUST NOT SLEEP, and MUST take inbound HTTP.
  #
  # It serves Merkle paths (/path) and, if relaying is on, submits actions on a user's
  # behalf (/relay) -- both called directly by atrum-client's browser code. A Render
  # Background Worker receives NO inbound network traffic at all, so `type: worker` here
  # would make the client's every call fail, not just risk a cold start. This has to be
  # `web`. The free instance type spins a Web Service down after 15 minutes idle, which
  # for this service is a closed market, not a slow one -- hence a paid instance type
  # (any of them; "starter" is the cheapest that never spins down), not a free one.
  # ---------------------------------------------------------------------------
  - type: web
    name: atrum-sequencer
    runtime: node
    plan: starter
    rootDir: sequencer
    buildCommand: npm ci && npm run build
    startCommand: npm run start:sequencer
    healthCheckPath: /health
    envVars:
      # Highest-priority way to pin the runtime (above .node-version/.nvmrc/engines, per
      # Render's own resolution order) -- needed for --experimental-strip-types below.
      # sequencer/.node-version also sets this for local `nvm`/`fnm` use; kept here too
      # because Render's docs do not confirm .node-version is honoured under a custom
      # rootDir, and NODE_VERSION unambiguously is.
      - key: NODE_VERSION
        value: "24"
      - key: NETWORK
        value: testnet
      - key: POOL_ADDRESS
        sync: false
      # Pays gas only. Never the committee key.
      - key: RELAYER_MNEMONIC
        sync: false
      # The public endpoint rate-limits hard and lies about balances on writes
      # (measured, see src/chains.ts) -- point this at a private RPC before real use.
      - key: RPC_URL
        sync: false
      - key: MAX_BATCH_DELAY_MS
        value: "60000"
      # Restrict once atrum-client has a fixed origin; "*" is fine for a public demo.
      - key: CORS_ORIGIN
        value: "*"
      # Relaying is opt-in: unset (or absent) means every user submits their own
      # transactions and their address goes on chain next to every action. Set this to
      # turn it on -- a mnemonic separate from RELAYER_MNEMONIC on purpose, so the
      # sequencer's onlySequencer-authorised account is never also the address every
      # relayed action traces to.
      - key: RELAY_MNEMONIC
        sync: false
      - key: RELAY_ACCOUNTS
        value: "5"
      - key: RELAY_RELEASE_INTERVAL_MS
        value: "5000"
      # Unset disables the gas top-up entirely. In wei; e.g. "20000000000000000" = 0.02
      # native token, sent to a withdraw's recipient in the same relayed batch.
      - key: RELAY_TOPUP_AMOUNT_WEI
        sync: false

  # ---------------------------------------------------------------------------
  # Publisher -- may sleep, and it is survivable.
  #
  # A sleeping publisher means stale odds, which is cosmetic: the attested ratio is
  # UNVERIFIED by construction and no payout reads it. Settlement goes through
  # publishFinalTotals, which carries a Chaum-Pedersen proof.
  # ---------------------------------------------------------------------------
  - type: web
    name: atrum-publisher
    runtime: node
    plan: free
    rootDir: sequencer
    buildCommand: npm ci && npm run build
    startCommand: npm run start:publisher
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NETWORK
        value: testnet
      - key: POOL_ADDRESS
        sync: false
      - key: ACCUMULATOR_ADDRESS
        sync: false
      - key: ENCRYPTED_POOL_ADDRESS
        sync: false
      - key: MARKET_IDS
        sync: false
      - key: DEPLOY_BLOCK
        sync: false
      # THE CROWN JEWELS. Set this by hand in the Render dashboard, in this service's own
      # environment group, and nowhere else. It must never appear in the sequencer's
      # environment, in a committed file, or in a log.
      - key: COMMITTEE_SECRET
        sync: false
      # Signs publishAttestedRatio. Pays gas, decrypts nothing -- deliberately a different
      # key from COMMITTEE_SECRET so a leaked hot wallet is not a privacy incident.
      - key: PUBLISHER_PRIVATE_KEY
        sync: false
      - key: RPC_URL
        sync: false
      - key: TICK_INTERVAL_MS
        value: "60000"
