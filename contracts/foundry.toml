[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"

# Optimizer on with a modest run count. Not cosmetic: the reference records that
# CoFHE's mock stack only fits under EIP-170 with the optimizer enabled at
# runs=200 and *overflows* again at runs=1,000,000. Contract size is sensitive to
# this setting, so it is pinned rather than left to the profile default.
optimizer = true
optimizer_runs = 200

# Monad has no blob transactions (type 3) and follows Ethereum's opcode set
# otherwise; Cancun is the correct target. Do not raise this without checking
# which precompiles and opcodes Monad actually implements.
evm_version = "cancun"

# Deterministic gas snapshots -- see `make gas` and the CI uniformity check.
gas_reports = ["Vault"]

# Tests etch circomlib's generated Poseidon runtime bytecode, which is produced by
# `circuits/scripts/gen_poseidon.mjs` -- it is raw EVM assembly, not Solidity, so it
# cannot be compiled here.
fs_permissions = [{ access = "read", path = "../circuits/build" }]

# Generated Groth16 verifiers are snarkjs output, not source. `forge fmt --check` in CI
# runs after `make verifiers` regenerates them, and snarkjs's own spacing does not satisfy
# it -- so without this the formatting gate fails on every run, on code nobody wrote and
# nobody should hand-edit.
[fmt]
ignore = ["src/verifiers/*.sol"]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

# Source verification. Monad testnet has no Etherscan-style API (`etherscanAPI: false`
# in Sourcify's own chain list), so verification goes through Sourcify:
#
#   forge verify-contract <addr> src/Foo.sol:Foo \
#     --verifier sourcify \
#     --verifier-url https://sourcify-api-monad.blockvision.org \
#     --chain 10143
#
# No API key needed. Sourcify matches the compiler metadata hash, so `solc`,
# `optimizer_runs` and `evm_version` above must be exactly what was deployed -- which is
# why they are pinned rather than left to profile defaults.
#
# `PoseidonT3` cannot be verified by any of this and never will be: it is raw EVM
# assembly emitted by circomlibjs (`circuits/scripts/gen_poseidon.mjs`) and deployed
# from a bytecode blob, so there is no Solidity source to match. Its correctness is
# established differently -- `Deploy.s.sol` asserts the deployed contract's
# Poseidon(1,2) equals circomlibjs's own answer before continuing, and
# `test_etchedPoseidonMatchesCircomlibjs` checks the same digest locally.
[etherscan]
